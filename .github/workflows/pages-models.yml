name: Deploy Flock with local model assets
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site and verified BirdNET assets
        shell: bash
        run: |
          set -euxo pipefail
          for f in app.js ml.js merlin.js metadata.js geo.js ui.js sw.js tests.cjs geo-tests.cjs geo-smoke.cjs; do node --check "$f"; done
          mkdir -p _site/models _site/vendor
          cp index.html style.css app.js ml.js merlin.js metadata.js geo.js ui.js sw.js manifest.webmanifest icon.svg recover.html version.json _site/
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/exifreader@4.52.0/dist/exif-reader.js -o _site/vendor/exif-reader.js
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/exifreader@4.52.0/LICENSE -o _site/vendor/ExifReader-LICENSE
          curl --fail --location --retry 3 https://heic.fyi/samples/exif-gps-date.heic -o /tmp/exif-gps-date.heic
          echo '01fd9fa28d09885d8482d01a5b36d88dc89fde3b7cfeaca50b70f8314d2c63d1  /tmp/exif-gps-date.heic' | sha256sum -c -
          TZ=UTC node tests.cjs /tmp/exif-gps-date.heic
          node geo-tests.cjs
          curl --fail --location --retry 4 --max-time 600 'https://zenodo.org/records/24362980/files/BirdNET%2B_Geomodel_V3.0.5_Global_14K.zip?download=1' -o /tmp/geo.zip
          echo 'd30b7f51ad301889ab193a384c72f1a1  /tmp/geo.zip' | md5sum -c -
          python3 extract-geo.py /tmp/geo.zip _site/models
          python3 -m venv /tmp/flock-geo-venv
          /tmp/flock-geo-venv/bin/pip install --disable-pip-version-check onnx==1.18.0 onnxruntime==1.22.1 numpy==2.2.6
          /tmp/flock-geo-venv/bin/python prepare-geo.py _site/models/geo-v305-fp32.onnx /tmp/geo-reference.json
          npm install --prefix /tmp/flock-ort --no-audit --no-fund onnxruntime-web@1.22.0
          node geo-smoke.cjs /tmp/flock-ort/node_modules/onnxruntime-web "$(pwd)/_site/models" /tmp/geo-reference.json
          cd _site/models
          base=https://zenodo.org/records/24362980/files
          curl --fail --location --retry 4 --max-time 600 "$base/BirdNET%2B_V3.0_Global_12K_FP16_pruned.onnx?download=1" -o birdnet.onnx
          curl --fail --location --retry 4 --max-time 180 "$base/BirdNET%2B_V3.0_Global_12K_Labels.csv?download=1" -o birdnet.csv
          curl --fail --location --retry 4 "$base/MODEL_LICENSE.txt?download=1" -o MODEL_LICENSE.txt
          curl --fail --location --retry 4 "$base/ACCEPTABLE_USE.txt?download=1" -o ACCEPTABLE_USE.txt
          printf '%s\n' '6b42d8905f25f856fb8ad91544138914  birdnet.onnx' 'bb25847af8a581e1382081382f01e762  birdnet.csv' '77b299ba50d3119cd28c5a2b6fc0ff4b  MODEL_LICENSE.txt' '92f52349d7a08f74167f096702bac26a  ACCEPTABLE_USE.txt' | md5sum -c -
          printf '%s\n' 'BirdNET+ V3.0.1 by Mario Lasseck et al. https://doi.org/10.5281/zenodo.24362980' > NOTICE.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow artifact metadata to propagate
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: deployment
