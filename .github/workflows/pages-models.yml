name: Deploy Hoot with local model assets
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore model assets and reference fixtures
        id: models
        uses: actions/cache/restore@v4
        with:
          path: .ci-models
          key: hoot-models-v1-linux-x64-${{ hashFiles('ci/prepare-models.sh', 'ci/requirements.txt', 'extract-geo.py', 'prepare-geo.py') }}
      - name: Restore precomputed region tables
        id: regions
        uses: actions/cache/restore@v4
        with:
          path: .ci-regions
          key: hoot-regions-v1-linux-x64-${{ hashFiles('ci/prepare-regions.sh', 'ci/requirements.txt', 'build-regions.py', 'build-ebird-codes.py') }}
      - uses: actions/setup-python@v5
        if: ${{ steps.models.outputs.cache-hit != 'true' || steps.regions.outputs.cache-hit != 'true' }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install asset preparation dependencies
        if: ${{ steps.models.outputs.cache-hit != 'true' || steps.regions.outputs.cache-hit != 'true' }}
        run: |
          python -m pip install --only-binary=:all: -r ci/requirements.txt
      - name: Prepare missing immutable assets in parallel
        if: ${{ steps.models.outputs.cache-hit != 'true' || steps.regions.outputs.cache-hit != 'true' }}
        env:
          MODELS_HIT: ${{ steps.models.outputs.cache-hit }}
          REGIONS_HIT: ${{ steps.regions.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          if [[ "$MODELS_HIT" != true ]]; then bash ci/prepare-models.sh & pids+=("$!"); fi
          if [[ "$REGIONS_HIT" != true ]]; then bash ci/prepare-regions.sh & pids+=("$!"); fi
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          test "$failed" = 0
      - name: Verify restored assets
        run: |
          (cd .ci-models && sha256sum -c SHA256SUMS)
          (cd .ci-regions && sha256sum -c SHA256SUMS)
      - name: Save verified model assets
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci-models
          key: ${{ steps.models.outputs.cache-primary-key }}
      - name: Save verified region tables
        if: ${{ steps.regions.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci-regions
          key: ${{ steps.regions.outputs.cache-primary-key }}
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a .ci-models/site/. .ci-regions/site/. _site/
          cp index.html style.css app.js ml.js merlin.js metadata.js geo.js regions.js ui.js sw.js manifest.webmanifest icon.svg recover.html version.json LICENSE.txt THIRD_PARTY_NOTICES.md _site/
      - name: Run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js *.cjs; do node --check "$f"; done
          node library-tests.cjs
          TZ=UTC node tests.cjs .ci-models/fixtures/exif-gps-date.heic
          node geo-tests.cjs
          node regions-tests.cjs _site/regions.json _site/ebird-codes.json
          npm install --prefix /tmp/hoot-ort --no-audit --no-fund onnxruntime-web@1.22.0
          node geo-smoke.cjs /tmp/hoot-ort/node_modules/onnxruntime-web "$(pwd)/_site/models" .ci-models/fixtures/geo-reference.json
          node geo-semantic.cjs /tmp/hoot-ort/node_modules/onnxruntime-web "$(pwd)/_site" .ci-models/fixtures/wing-labels.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow artifact metadata to propagate
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: deployment
