name: Python runtime for local model evaluation
on:
  push:
    branches: [detector-eval]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: --no-deps onnxruntime -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-wheel
          path: wheels/
          retention-days: 1
