name: Deploy Hoot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify committed asset fingerprints and checksums
        env:
          MODEL_KEY: ${{ hashFiles('ci/prepare-models.sh', 'ci/requirements.txt', 'ci/seed-assets.sh', 'ci/enrich-geo-labels.py', 'extract-geo.py', 'prepare-geo.py') }}
          REGION_KEY: ${{ hashFiles('ci/prepare-regions.sh', 'ci/requirements.txt', 'ci/seed-assets.sh', 'build-regions.py', 'build-ebird-codes.py') }}
        run: |
          set -euo pipefail
          for bundle in models regions; do
            if [[ ! -f "prebuilt/$bundle/INPUTS" ]]; then
              echo "::error::Missing $bundle assets. Run Prepare Hoot assets first."
              exit 1
            fi
          done
          if [[ "$(cat prebuilt/models/INPUTS)" != "$MODEL_KEY" || "$(cat prebuilt/regions/INPUTS)" != "$REGION_KEY" ]]; then
            echo "::error::Asset preparation inputs changed. Run Prepare Hoot assets before deployment."
            exit 1
          fi
          (cd prebuilt/models && sha256sum -c SHA256SUMS)
          (cd prebuilt/regions && sha256sum -c SHA256SUMS)
      - name: Assemble site and test
        run: bash ci/test-site.sh prebuilt/models prebuilt/regions
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow artifact metadata to propagate
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: deployment
