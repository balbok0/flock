<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoot update recovery</title><h1>Hoot update recovery</h1><p>This removes only old app shell caches and service worker registrations for Hoot. Models and sightings are retained.</p><button id="go">Repair app update</button><p id="status"></p><script>document.getElementById('go').onclick=async()=>{try{const scope=new URL('./',location.href).href;for(const r of await navigator.serviceWorker.getRegistrations())if(r.scope===scope)await r.unregister();for(const k of await caches.keys())if(/^flock-v\d+$/.test(k))await caches.delete(k);document.getElementById('status').textContent='App shell reset. Close Hoot and reopen it, or use the link below.';document.getElementById('link').href=new URL('./?repair='+Date.now(),location.href).href;}catch(e){document.getElementById('status').textContent=e.message}};</script><p><a id="link" href="./">Open Hoot</a></p>
